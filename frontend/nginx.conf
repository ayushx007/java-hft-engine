server {
    listen 80;
    
    # 1. Serve the React App (Static Files)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA Fallback for React Router
    }

    # 2. Proxy API requests to Backend Container
    location /api/ {
        proxy_pass http://backend:8080; # Matches service name 'backend' in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Proxy WebSocket connections (Live Feed)
    location /ws-message/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}