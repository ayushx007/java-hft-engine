server {
    listen 80;
    server_name trading-engine.duckdns.org;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name trading-engine.duckdns.org;

    # SSL Certificate Paths (Must match the mounts in docker-compose.yml)
    ssl_certificate /etc/letsencrypt/live/trading-engine.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading-engine.duckdns.org/privkey.pem;

    # Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 1. Serve the React App (Static Files)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA Fallback for React Router
    }

    # 2. Proxy API requests to Backend Container
    # Note: Using 'trading-backend' to match the container_name in your compose
    location /api/ {
        proxy_pass http://trading-backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy WebSocket connections (Live Feed)
    location /ws-message/ {
        proxy_pass http://trading-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}