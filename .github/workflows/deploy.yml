name: CI/CD Pipeline (Oracle Cloud)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push Backend
      - name: Build Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/trading-backend:latest

      # Build & Push Frontend
      - name: Build Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/trading-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/java-hft-engine
            
            # 1. Force the server to match GitHub (Fixes the Git Conflict)
            # This deletes local manual edits to docker-compose.yml on the server
            git fetch --all
            git reset --hard origin/main
            
            # 2. Login to Docker Hub
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # 3. Use hyphenated docker-compose for older Docker versions on the VM
            # We pull both to ensure the latest frontend with SSL config is used
            sudo docker-compose pull backend frontend
            
            # 4. Restart only the apps to save CPU cycles
            # The --force-recreate ensures the new SSL port mappings are applied
            sudo docker-compose up -d --no-deps --force-recreate backend frontend
            
            # 5. Clean up old images to save disk space
            sudo docker image prune -f