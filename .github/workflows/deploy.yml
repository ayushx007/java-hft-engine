name: CI/CD Pipeline (Oracle Cloud)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push Backend
      - name: Build Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/trading-backend:latest

      # Build & Push Frontend
      - name: Build Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/trading-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/java-hft-engine
            
            # 1. Force the server to match GitHub (Fixes potential Git Conflicts)
            git fetch --all
            git reset --hard origin/main
            
            # 2. Login to Docker Hub
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # 3. Pull latest images
            docker compose pull backend frontend
            
            # 4. FIX: Remove existing containers before recreation to avoid name conflicts
            # This handles the 'Conflict. The container name is already in use' error
            docker compose rm -f -s backend frontend
            
            # 5. Restart only the apps
            docker compose up -d --no-deps backend frontend
            
            # 6. Clean up old images to save disk space
            docker image prune -f